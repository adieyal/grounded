name: Deploy Todo demo to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/todo-pages.yml"
      - "examples/todo/**"
      - "lattice/**"
      - "pyproject.toml"
      - "src/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Validate Todo Lattice
        run: uv run lattice --root examples/todo validate

      - name: Render Todo docs
        run: uv run lattice --root examples/todo render

      - name: Audit Todo Lattice
        run: uv run lattice --root examples/todo audit

      - name: Check rendered Todo docs
        run: uv run lattice --root examples/todo render --check

      - name: Disable Jekyll
        run: touch examples/todo/site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: examples/todo/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
