[project]
name = "grounded"
version = "1.0.0"
description = "Executable project memory with single-owner specs, generated views, and drift checks."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Grounded contributors" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "documentation",
    "knowledge-graph",
    "llm",
    "project-memory",
    "software-governance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1.0",
    "jsonschema>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/adieyal/grounded"
Repository = "https://github.com/adieyal/grounded"
Documentation = "https://adieyal.github.io/grounded/"
Issues = "https://github.com/adieyal/grounded/issues"
Changelog = "https://github.com/adieyal/grounded/blob/master/CHANGELOG.md"

[project.scripts]
grounded = "grounded.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
