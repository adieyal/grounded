[project]
name = "grounded"
version = "0.13.0"
description = "Executable project memory with single-owner specs, generated views, and drift checks."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Grounded contributors" }]
dependencies = [
    "jinja2>=3.1.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
grounded = "grounded.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
